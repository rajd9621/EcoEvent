<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contact')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-5">
    <h2 class="fw-bold text-primary mb-4">Contact Us</h2>
    <div class="row g-4">
        <div class="col-md-6">
            <div th:if="${success != null}" class="alert alert-success" th:text="${success}">Success</div>
            <form th:action="@{/contact}" method="post">
                <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" required/></div>
                <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required/></div>
                <div class="mb-3"><label class="form-label">Subject</label><input type="text" name="subject" class="form-control" required/></div>
                <div class="mb-3"><label class="form-label">Message</label><textarea name="message" rows="5" class="form-control" required></textarea></div>
                <button type="submit" class="btn btn-primary px-4">Send Message</button>
            </form>
        </div>
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body p-4">
                    <h5 class="fw-bold text-primary"><i class="bi bi-geo-alt me-2"></i>Address</h5>
                    <p class="text-muted" th:text="${settings.contactAddress != null ? settings.contactAddress : 'EcoEvent HQ, India'}">Address</p>
                    <hr/>
                    <h5 class="fw-bold text-primary"><i class="bi bi-envelope me-2"></i>Email</h5>
                    <p class="text-muted" th:text="${settings.contactEmail != null ? settings.contactEmail : 'contact@ecoevent.com'}">Email</p>
                    <hr/>
                    <h5 class="fw-bold text-primary"><i class="bi bi-telephone me-2"></i>Phone</h5>
                    <p class="text-muted" th:text="${settings.contactPhone != null ? settings.contactPhone : '+91 9999999999'}">Phone</p>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
