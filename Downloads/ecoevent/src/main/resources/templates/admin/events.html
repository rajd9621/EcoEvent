<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Events')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary mb-0"><i class="bi bi-calendar-event me-2"></i>Events</h2>
            <a th:href="@{/organizer/events/create}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Create Event</a>
        </div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}">Success</div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light"><tr><th>Title</th><th>Organizer</th><th>Date</th><th>Status</th><th>Sustainable</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr th:each="event : ${events}">
                            <td th:text="${event.title}">Title</td>
                            <td th:text="${event.organizer != null ? event.organizer.fullName : 'N/A'}">Organizer</td>
                            <td th:text="${event.startDate != null ? #temporals.format(event.startDate, 'dd MMM yyyy') : 'N/A'}">Date</td>
                            <td><span class="badge" th:classappend="${event.published ? 'bg-success' : 'bg-secondary'}" th:text="${event.published ? 'Published' : 'Draft'}">Status</span></td>
                            <td><i class="bi" th:classappend="${event.sustainable ? 'bi-check-circle text-success' : 'bi-x-circle text-danger'}"></i></td>
                            <td>
                                <a th:href="@{'/events/' + ${event.id}}" class="btn btn-sm btn-outline-info"><i class="bi bi-eye"></i></a>
                                <a th:href="@{'/admin/events/' + ${event.id} + '/toggle-publish'}" class="btn btn-sm btn-outline-warning"><i class="bi bi-power"></i></a>
                                <a th:href="@{'/reports/event/' + ${event.id} + '/pdf'}" class="btn btn-sm btn-outline-primary"><i class="bi bi-file-pdf"></i></a>
                                <a th:href="@{'/admin/events/' + ${event.id} + '/delete'}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this event?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
