<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pages')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
<h2 class="fw-bold text-primary mb-4"><i class="bi bi-file-earmark me-2"></i>Website Pages</h2>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="row">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h5>Create Page</h5>
                <form th:action="@{/admin/pages/save}" method="post">
                    <input type="hidden" name="id"/>
                    <div class="mb-2"><label class="form-label small">Page Name</label><input type="text" name="name" class="form-control" required/></div>
                    <div class="mb-2"><label class="form-label small">URL Slug</label><input type="text" name="slug" class="form-control" required placeholder="about-us"/></div>
                    <div class="mb-2"><label class="form-label small">Title</label><input type="text" name="title" class="form-control"/></div>
                    <div class="mb-2"><label class="form-label small">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
                    <div class="mb-3"><label class="form-label small">Display Order</label><input type="number" name="displayOrder" class="form-control" value="0"/></div>
                    <div class="form-check mb-3"><input type="checkbox" name="visible" class="form-check-input" checked/><label class="form-check-label small">Visible</label></div>
                    <button type="submit" class="btn btn-primary w-100">Save Page</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light"><tr><th>Name</th><th>Slug</th><th>Sections</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr th:each="page : ${pages}">
                            <td th:text="${page.name}">Name</td>
                            <td><code th:text="'/page/' + ${page.slug}">/slug</code></td>
                            <td><a th:href="@{'/admin/pages/' + ${page.id} + '/sections'}" class="btn btn-sm btn-outline-info">Manage</a></td>
                            <td><span class="badge" th:classappend="${page.visible ? 'bg-success' : 'bg-secondary'}" th:text="${page.visible ? 'Visible' : 'Hidden'}">Status</span></td>
                            <td>
                                <a th:href="@{'/page/' + ${page.slug}}" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></a>
                                <a th:unless="${page.systemPage}" th:href="@{'/admin/pages/' + ${page.id} + '/delete'}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete page?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
