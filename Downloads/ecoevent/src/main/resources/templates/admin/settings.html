<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Settings')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
<h2 class="fw-bold text-primary mb-4"><i class="bi bi-gear me-2"></i>Site Settings</h2>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form th:action="@{/admin/settings/save}" method="post" th:object="${settings}">
            <input type="hidden" th:field="*{id}"/>
            <div class="row mb-3">
                <div class="col-md-6"><label class="form-label">Site Name</label><input type="text" th:field="*{siteName}" class="form-control"/></div>
                <div class="col-md-6"><label class="form-label">Tagline</label><input type="text" th:field="*{tagline}" class="form-control"/></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6"><label class="form-label">Logo URL</label><input type="text" th:field="*{logoUrl}" class="form-control"/></div>
                <div class="col-md-6"><label class="form-label">Favicon URL</label><input type="text" th:field="*{faviconUrl}" class="form-control"/></div>
            </div>
            <h6 class="mt-4">Announcement</h6>
            <div class="mb-3"><label class="form-label">Announcement Text</label><textarea th:field="*{announcementText}" class="form-control" rows="2"></textarea></div>
            <div class="form-check mb-3"><input type="checkbox" th:field="*{announcementActive}" class="form-check-input"/><label class="form-check-label">Show Announcement</label></div>
            <h6 class="mt-4">Contact Information</h6>
            <div class="row mb-3">
                <div class="col-md-4"><label class="form-label">Email</label><input type="text" th:field="*{contactEmail}" class="form-control"/></div>
                <div class="col-md-4"><label class="form-label">Phone</label><input type="text" th:field="*{contactPhone}" class="form-control"/></div>
                <div class="col-md-4"><label class="form-label">Address</label><input type="text" th:field="*{contactAddress}" class="form-control"/></div>
            </div>
            <h6 class="mt-4">Social Media</h6>
            <div class="row mb-3">
                <div class="col-md-3"><label class="form-label">Facebook</label><input type="text" th:field="*{socialFacebook}" class="form-control"/></div>
                <div class="col-md-3"><label class="form-label">Twitter</label><input type="text" th:field="*{socialTwitter}" class="form-control"/></div>
                <div class="col-md-3"><label class="form-label">Instagram</label><input type="text" th:field="*{socialInstagram}" class="form-control"/></div>
                <div class="col-md-3"><label class="form-label">LinkedIn</label><input type="text" th:field="*{socialLinkedin}" class="form-control"/></div>
            </div>
            <div class="mb-3"><label class="form-label">Footer Text</label><textarea th:field="*{footerText}" class="form-control" rows="2"></textarea></div>
            <button type="submit" class="btn btn-primary">Save Settings</button>
        </form>
    </div>
</div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
