<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <h2 class="fw-bold text-primary mb-4"><i class="bi bi-tags me-2"></i>Event Categories</h2>
        <div th:if="${success}" class="alert alert-success" th:text="${success}">Success</div>
        <div class="row">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5>Add/Edit Category</h5>
                        <form th:action="@{/admin/categories/save}" method="post">
                            <input type="hidden" name="id" id="catId"/>
                            <div class="mb-2"><label class="form-label small">Name</label><input type="text" name="name" class="form-control" required/></div>
                            <div class="mb-2"><label class="form-label small">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
                            <div class="mb-2"><label class="form-label small">Icon Class</label><input type="text" name="iconClass" class="form-control" placeholder="bi-building"/></div>
                            <div class="mb-3"><label class="form-label small">Color Code</label><input type="text" name="colorCode" class="form-control" placeholder="#2E7D32"/></div>
                            <button type="submit" class="btn btn-primary w-100">Save Category</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-light"><tr><th>Name</th><th>Description</th><th>Icon</th><th>Actions</th></tr></thead>
                            <tbody>
                                <tr th:each="cat : ${categories}">
                                    <td th:text="${cat.name}">Name</td>
                                    <td th:text="${cat.description}">Desc</td>
                                    <td><i class="bi" th:classappend="${cat.iconClass}"></i></td>
                                    <td><a th:href="@{'/admin/categories/' + ${cat.id} + '/delete'}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete?')"><i class="bi bi-trash"></i></a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
