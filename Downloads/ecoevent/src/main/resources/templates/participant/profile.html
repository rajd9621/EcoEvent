<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-4">
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="fw-bold text-primary mb-4">My Profile</h2>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form th:action="@{/participant/profile/update}" method="post">
                    <div class="mb-3"><label class="form-label">Full Name</label><input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required/></div>
                    <div class="mb-3"><label class="form-label">Email (cannot change)</label><input type="email" class="form-control" th:value="${user.email}" disabled/></div>
                    <div class="mb-3"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control" th:value="${user.phone}"/></div>
                    <div class="mb-3"><label class="form-label">Organization</label><input type="text" name="organization" class="form-control" th:value="${user.organization}"/></div>
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
