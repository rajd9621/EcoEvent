<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Registrations')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-4">
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary mb-0">My Registrations</h2>
            <a th:href="@{/events}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Browse Events</a>
        </div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light"><tr><th>Event</th><th>Date</th><th>Status</th><th>Ticket</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr th:each="reg : ${registrations}">
                            <td th:text="${reg.event != null ? reg.event.title : 'N/A'}">Event</td>
                            <td th:text="${reg.event != null and reg.event.startDate != null ? #temporals.format(reg.event.startDate, 'dd MMM yyyy') : ''}">Date</td>
                            <td><span class="badge bg-info" th:text="${reg.status}">Status</span></td>
                            <td><code th:text="${reg.ticket != null ? reg.ticket.ticketCode : 'Pending'}">Code</code></td>
                            <td><a th:href="@{'/events/' + ${reg.event.id}}" class="btn btn-sm btn-outline-info">View</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <p th:if="${registrations.isEmpty()}" class="text-muted mt-3">No registrations yet. <a th:href="@{/events}">Browse events</a> to register.</p>
    </div>
</div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
