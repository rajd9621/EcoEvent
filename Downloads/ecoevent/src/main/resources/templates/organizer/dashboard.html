<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Organizer Dashboard')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-4">
<div class="d-flex">
    <div th:replace="~{fragments/organizer-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <h2 class="fw-bold text-primary mb-4">Organizer Dashboard</h2>
        <div class="row g-3 mb-4">
            <div class="col-md-4"><div class="card border-0 shadow-sm p-3"><h6 class="text-muted small">Total Events</h6><h3 th:text="${totalEvents}">0</h3></div></div>
            <div class="col-md-4"><div class="card border-0 shadow-sm p-3"><h6 class="text-muted small">Total Registrations</h6><h3 th:text="${#lists.size(registrations != null ? registrations : #lists.emptyList())}">0</h3></div></div>
            <div class="col-md-4"><div class="card border-0 shadow-sm p-3"><h6 class="text-muted small">Organizer</h6><h6 th:text="${organizer.fullName}">Name</h6></div></div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Your Events</h4>
            <a th:href="@{/organizer/events/create}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Create Event</a>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light"><tr><th>Title</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr th:each="event : ${events}">
                            <td th:text="${event.title}">Title</td>
                            <td th:text="${event.startDate != null ? #temporals.format(event.startDate, 'dd MMM yyyy') : 'N/A'}">Date</td>
                            <td><span class="badge" th:classappend="${event.published ? 'bg-success' : 'bg-secondary'}" th:text="${event.published ? 'Published' : 'Draft'}">Status</span></td>
                            <td>
                                <a th:href="@{'/organizer/events/' + ${event.id} + '/edit'}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i> Edit</a>
                                <a th:href="@{'/organizer/events/' + ${event.id} + '/attendance'}" class="btn btn-sm btn-outline-info"><i class="bi bi-people"></i></a>
                                <a th:href="@{'/reports/event/' + ${event.id} + '/pdf'}" class="btn btn-sm btn-outline-success"><i class="bi bi-file-pdf"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
