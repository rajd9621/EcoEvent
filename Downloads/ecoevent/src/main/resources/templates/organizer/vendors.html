<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vendors')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-4">
<div class="row">
    <div class="col-12">
        <h2 class="fw-bold text-primary mb-4">Sustainable Vendors</h2>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light"><tr><th>Name</th><th>Type</th><th>Certified</th><th>Local</th><th>Rating</th></tr></thead>
                    <tbody>
                        <tr th:each="v : ${vendors}">
                            <td th:text="${v.name}">Name</td>
                            <td th:text="${v.vendorType}">Type</td>
                            <td><i class="bi" th:classappend="${v.sustainabilityCertified ? 'bi-shield-check text-success' : 'bi-dash text-muted'}"></i></td>
                            <td><i class="bi" th:classappend="${v.local ? 'bi-geo-alt text-success' : 'bi-dash text-muted'}"></i></td>
                            <td th:text="${v.rating != null ? v.rating + '/5' : 'N/A'}">Rating</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
