<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Not Found')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-5 text-center">
    <i class="bi bi-exclamation-triangle text-warning" style="font-size:5rem"></i>
    <h1 class="display-4 fw-bold mt-3">404</h1>
    <p class="lead text-muted" th:text="${error != null ? error : 'The page you are looking for does not exist.'}">Not found</p>
    <a th:href="@{/}" class="btn btn-primary mt-3">Go Home</a>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
