<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-4">
<div class="row">
    <div class="col-12">
        <h2 class="fw-bold text-primary mb-4">Notifications</h2>
        <div class="list-group">
            <div th:each="n : ${notifications}" class="list-group-item list-group-item-action">
                <div class="d-flex justify-content-between">
                    <strong><i class="bi bi-bell me-1"></i><span th:text="${n.title}">Title</span></strong>
                    <small class="text-muted" th:text="${n.createdAt != null ? #temporals.format(n.createdAt, 'dd MMM yyyy HH:mm') : ''}">Date</small>
                </div>
                <p class="mb-0 text-muted" th:text="${n.message}">Message</p>
                <a th:if="${n.linkUrl != null}" th:href="@{${n.linkUrl}}" class="small">View Details</a>
            </div>
            <p th:if="${notifications.isEmpty()}" class="text-muted p-3">No notifications.</p>
        </div>
    </div>
</div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
