<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-4">
<div class="row">
    <div class="col-md-3">
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body text-center">
                <i class="bi bi-person-circle text-primary" style="font-size:3rem"></i>
                <h5 class="mt-2" th:text="${user.fullName}">Name</h5>
                <p class="text-muted small mb-2" th:text="${user.email}">Email</p>
                <span class="badge bg-info" th:text="${user.role.replace('ROLE_', '')}">Role</span>
            </div>
        </div>
        <div class="list-group">
            <a th:href="@{/participant/dashboard}" class="list-group-item list-group-item-action active"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a th:href="@{/participant/registrations}" class="list-group-item list-group-item-action"><i class="bi bi-clipboard-check me-2"></i>My Registrations</a>
            <a th:href="@{/participant/tickets}" class="list-group-item list-group-item-action"><i class="bi bi-qr-code me-2"></i>My Tickets</a>
            <a th:href="@{/participant/feedback}" class="list-group-item list-group-item-action"><i class="bi bi-chat-dots me-2"></i>Feedback</a>
            <a th:href="@{/participant/notifications}" class="list-group-item list-group-item-action"><i class="bi bi-bell me-2"></i>Notifications <span th:if="${unreadCount > 0}" class="badge bg-danger" th:text="${unreadCount}">0</span></a>
            <a th:href="@{/participant/profile}" class="list-group-item list-group-item-action"><i class="bi bi-person me-2"></i>Profile</a>
        </div>
    </div>
    <div class="col-md-9">
        <h2 class="fw-bold text-primary mb-4">Dashboard</h2>
        <div class="row g-3 mb-4">
            <div class="col-md-4"><div class="card border-0 shadow-sm p-3"><h6 class="text-muted small">My Registrations</h6><h3 th:text="${#lists.size(registrations)}">0</h3></div></div>
            <div class="col-md-4"><div class="card border-0 shadow-sm p-3"><h6 class="text-muted small">Notifications</h6><h3 th:text="${unreadCount}">0</h3></div></div>
            <div class="col-md-4"><div class="card border-0 shadow-sm p-3"><h6 class="text-muted small">Upcoming Events</h6><h3 th:text="${#lists.size(upcomingEvents)}">0</h3></div></div>
        </div>
        
        <h5>Recent Notifications</h5>
        <div class="list-group mb-4">
            <div th:each="n : ${notifications}" class="list-group-item list-group-item-action" th:if="${nStat.count <= 5}">
                <div class="d-flex justify-content-between">
                    <strong th:text="${n.title}">Title</strong>
                    <small class="text-muted" th:text="${n.createdAt != null ? #temporals.format(n.createdAt, 'dd MMM HH:mm') : ''}">Date</small>
                </div>
                <p class="mb-0 text-muted small" th:text="${n.message}">Message</p>
            </div>
            <p th:if="${notifications.isEmpty()}" class="text-muted p-3">No notifications yet.</p>
        </div>
        
        <h5>Upcoming Events</h5>
        <div class="row g-3">
            <div class="col-md-6" th:each="event : ${upcomingEvents}" th:if="${eventStat.count <= 4}">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 th:text="${event.title}">Title</h6>
                        <p class="text-muted small mb-2"><i class="bi bi-calendar me-1"></i><span th:text="${event.startDate != null ? #temporals.format(event.startDate, 'dd MMM yyyy') : ''}">Date</span></p>
                        <a th:href="@{'/events/' + ${event.id}}" class="btn btn-sm btn-primary">View & Register</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
