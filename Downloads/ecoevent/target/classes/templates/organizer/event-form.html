<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Event')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-4">
<div class="row justify-content-center">
    <div class="col-lg-10">
        <h2 class="fw-bold text-primary mb-4">Create New Event</h2>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form th:action="@{/organizer/events/save}" method="post">
                    <input type="hidden" name="id" th:if="${event.id != null}" th:value="${event.id}"/>
                    <h5>Basic Information</h5>
                    <div class="row mb-3">
                        <div class="col-md-8"><label class="form-label">Event Title</label><input type="text" name="title" class="form-control" required th:value="${event.title}"/></div>
                        <div class="col-md-4"><label class="form-label">Category</label><select name="categoryId" class="form-select"><option value="">Select Category</option><option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${event.category != null and event.category.id == cat.id}">Cat</option></select></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3" th:text="${event.description}"></textarea></div>
                    <div class="mb-3"><label class="form-label">Location</label><input type="text" name="location" class="form-control" required th:value="${event.location}"/></div>
                    
                    <h5 class="mt-4">Schedule</h5>
                    <div class="row mb-3">
                        <div class="col-md-6"><label class="form-label">Start Date & Time</label><input type="datetime-local" name="startDate" class="form-control" required th:value="${event.startDate != null ? #temporals.format(event.startDate, 'yyyy-MM-dd''T''HH:mm')} : ''}"/></div>
                        <div class="col-md-6"><label class="form-label">End Date & Time</label><input type="datetime-local" name="endDate" class="form-control" th:value="${event.endDate != null ? #temporals.format(event.endDate, 'yyyy-MM-dd''T''HH:mm')} : ''}"/></div>
                    </div>
                    
                    <h5 class="mt-4">Participants & Ticketing</h5>
                    <div class="row mb-3">
                        <div class="col-md-4"><label class="form-label">Expected Attendance</label><input type="number" name="expectedAttendance" class="form-control" th:value="${event.expectedAttendance}"/></div>
                        <div class="col-md-4"><label class="form-label">Max Participants</label><input type="number" name="maxParticipants" class="form-control" th:value="${event.maxParticipants}"/></div>
                        <div class="col-md-4"><label class="form-label">Ticket Price (₹)</label><input type="number" step="0.01" name="ticketPrice" class="form-control" th:value="${event.ticketPrice}"/></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Image URL</label><input type="text" name="imageUrl" class="form-control" th:value="${event.imageUrl}"/></div>
                    
                    <h5 class="mt-4">Sustainable Practices (SDG 12)</h5>
                    <div class="row mb-3">
                        <div class="col-md-4"><div class="form-check"><input type="checkbox" name="digitalInvitations" class="form-check-input" th:checked="${event.digitalInvitations}"/><label class="form-check-label">Digital Invitations</label></div></div>
                        <div class="col-md-4"><div class="form-check"><input type="checkbox" name="digitalTickets" class="form-check-input" th:checked="${event.digitalTickets}"/><label class="form-check-label">Digital Tickets</label></div></div>
                        <div class="col-md-4"><div class="form-check"><input type="checkbox" name="reusableDecorations" class="form-check-input" th:checked="${event.reusableDecorations}"/><label class="form-check-label">Reusable Decorations</label></div></div>
                        <div class="col-md-4"><div class="form-check"><input type="checkbox" name="wasteSegregation" class="form-check-input" th:checked="${event.wasteSegregation}"/><label class="form-check-label">Waste Segregation</label></div></div>
                        <div class="col-md-4"><div class="form-check"><input type="checkbox" name="sustainableFoodPractices" class="form-check-input" th:checked="${event.sustainableFoodPractices}"/><label class="form-check-label">Sustainable Food</label></div></div>
                        <div class="col-md-4"><div class="form-check"><input type="checkbox" name="sustainable" class="form-check-input" checked/><label class="form-check-label">Mark as Sustainable</label></div></div>
                        <div class="col-md-4"><div class="form-check"><input type="checkbox" name="published" class="form-check-input" checked/><label class="form-check-label">Publish Event</label></div></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary px-5">Save Event</button>
                    <a th:href="@{/organizer/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
