<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Attendance')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-4">
<div class="row">
    <div class="col-12">
        <h2 class="fw-bold text-primary mb-2">Attendance: <span th:text="${event.title}">Event</span></h2>
        <p><a th:href="@{'/organizer/events/' + ${event.id} + '/edit'}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Event</a></p>
        <div class="row g-3 mb-4">
            <div class="col-md-3"><div class="card border-0 shadow-sm p-3"><h6 class="text-muted small">Total Registered</h6><h3 th:text="${#lists.size(registrations)}">0</h3></div></div>
            <div class="col-md-3"><div class="card border-0 shadow-sm p-3"><h6 class="text-muted small">Present</h6><h3 class="text-success" th:text="${presentCount}">0</h3></div></div>
            <div class="col-md-3"><div class="card border-0 shadow-sm p-3"><h6 class="text-muted small">Absent</h6><h3 class="text-danger" th:text="${absentCount}">0</h3></div></div>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light"><tr><th>Participant</th><th>Email</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr th:each="reg : ${registrations}">
                            <td th:text="${reg.user != null ? reg.user.fullName : 'N/A'}">Name</td>
                            <td th:text="${reg.user != null ? reg.user.email : ''}">Email</td>
                            <td>
                                <form th:action="@{'/organizer/events/' + ${event.id} + '/attendance/' + ${reg.id} + '/mark'}" method="post" class="d-inline">
                                    <button type="submit" name="status" value="PRESENT" class="btn btn-sm btn-success"><i class="bi bi-check"></i> Present</button>
                                </form>
                                <form th:action="@{'/organizer/events/' + ${event.id} + '/attendance/' + ${reg.id} + '/mark'}" method="post" class="d-inline">
                                    <button type="submit" name="status" value="ABSENT" class="btn btn-sm btn-danger"><i class="bi bi-x"></i> Absent</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
