<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Feedback')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
<h2 class="fw-bold text-primary mb-4"><i class="bi bi-chat-dots me-2"></i>Feedback Management</h2>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>User</th><th>Event</th><th>Rating</th><th>Comment</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
                <tr th:each="fb : ${feedbacks}">
                    <td th:text="${fb.user != null ? fb.user.fullName : 'Anonymous'}">User</td>
                    <td th:text="${fb.event != null ? fb.event.title : 'N/A'}">Event</td>
                    <td><span th:text="'⭐'.repeat(fb.rating != null ? fb.rating : 0)">Rating</span></td>
                    <td th:text="${#strings.abbreviate(fb.comment, 60)}">Comment</td>
                    <td>
                        <span class="badge" th:classappend="${fb.approved ? 'bg-success' : 'bg-warning'}" th:text="${fb.approved ? 'Approved' : 'Pending'}">Status</span>
                        <span th:if="${fb.featured}" class="badge bg-primary">Featured</span>
                    </td>
                    <td>
                        <a th:unless="${fb.approved}" th:href="@{'/admin/feedback/' + ${fb.id} + '/approve'}" class="btn btn-sm btn-outline-success"><i class="bi bi-check"></i></a>
                        <a th:href="@{'/admin/feedback/' + ${fb.id} + '/feature'}" class="btn btn-sm btn-outline-primary"><i class="bi bi-star"></i></a>
                        <a th:href="@{'/admin/feedback/' + ${fb.id} + '/delete'}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
