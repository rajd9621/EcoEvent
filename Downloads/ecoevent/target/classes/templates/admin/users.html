<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Users')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <h2 class="fw-bold text-primary mb-4"><i class="bi bi-people me-2"></i>Users</h2>
        <div th:if="${success}" class="alert alert-success" th:text="${success}">Success</div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light"><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.fullName}">Name</td>
                            <td th:text="${user.email}">Email</td>
                            <td><span class="badge bg-info" th:text="${user.role.replace('ROLE_', '')}">Role</span></td>
                            <td th:text="${user.phone}">Phone</td>
                            <td><span class="badge" th:classappend="${user.enabled ? 'bg-success' : 'bg-danger'}" th:text="${user.enabled ? 'Active' : 'Disabled'}">Status</span></td>
                            <td>
                                <a th:href="@{'/admin/users/' + ${user.id} + '/toggle'}" class="btn btn-sm btn-outline-warning"><i class="bi bi-power"></i></a>
                                <a th:href="@{'/admin/users/' + ${user.id} + '/delete'}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this user?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
