<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
<h2 class="fw-bold text-primary mb-4"><i class="bi bi-bell me-2"></i>Send Notification</h2>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form th:action="@{/admin/notifications/send}" method="post">
            <div class="row mb-3">
                <div class="col-md-6"><label class="form-label">User</label><select name="userId" class="form-select" required><option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName + ' (' + u.role + ')'}">User</option></select></div>
                <div class="col-md-6"><label class="form-label">Type</label><select name="type" class="form-select"><option value="INFO">Info</option><option value="EVENT">Event</option><option value="TICKET">Ticket</option><option value="ALERT">Alert</option></select></div>
            </div>
            <div class="mb-3"><label class="form-label">Title</label><input type="text" name="title" class="form-control" required/></div>
            <div class="mb-3"><label class="form-label">Message</label><textarea name="message" class="form-control" rows="3" required></textarea></div>
            <button type="submit" class="btn btn-primary">Send Notification</button>
        </form>
    </div>
</div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
