<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Payments')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
<h2 class="fw-bold text-primary mb-4"><i class="bi bi-credit-card me-2"></i>Payments</h2>
<div class="row g-3 mb-4">
    <div class="col-md-6"><div class="card border-0 shadow-sm p-3"><h6 class="text-muted small">Total Revenue</h6><h3 th:text="'₹' + ${#numbers.formatDecimal(totalRevenue, 0, 0)}">₹0</h3></div></div>
    <div class="col-md-6"><div class="card border-0 shadow-sm p-3"><h6 class="text-muted small">Total Payments</h6><h3 th:text="${#lists.size(payments)}">0</h3></div></div>
</div>
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>Transaction ID</th><th>User</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
            <tbody>
                <tr th:each="p : ${payments}">
                    <td><code th:text="${p.transactionId}">TXN</code></td>
                    <td th:text="${p.user != null ? p.user.fullName : 'N/A'}">User</td>
                    <td th:text="'₹' + ${p.amount}">Amount</td>
                    <td><span class="badge" th:classappend="${p.status.name() == 'COMPLETED' ? 'bg-success' : 'bg-warning'}" th:text="${p.status}">Status</span></td>
                    <td th:text="${p.paymentDate != null ? #temporals.format(p.paymentDate, 'dd MMM yyyy') : 'N/A'}">Date</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
