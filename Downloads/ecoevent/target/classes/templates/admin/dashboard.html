<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <h2 class="fw-bold text-primary mb-4"><i class="bi bi-speedometer2 me-2"></i>Dashboard Overview</h2>
        <div th:if="${success != null}" class="alert alert-success" th:text="${success}">Success</div>
        
        <div class="row g-3 mb-4">
            <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><div class="d-flex justify-content-between"><div><h6 class="text-muted small">Total Events</h6><h3 class="fw-bold text-primary" th:text="${stats.totalEvents}">0</h3></div><i class="bi bi-calendar-event text-primary" style="font-size:2rem;opacity:0.3"></i></div></div></div></div>
            <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><div class="d-flex justify-content-between"><div><h6 class="text-muted small">Sustainable Events</h6><h3 class="fw-bold text-success" th:text="${stats.sustainableEvents}">0</h3></div><i class="bi bi-globe text-success" style="font-size:2rem;opacity:0.3"></i></div></div></div></div>
            <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><div class="d-flex justify-content-between"><div><h6 class="text-muted small">Total Users</h6><h3 class="fw-bold text-info" th:text="${stats.totalUsers}">0</h3></div><i class="bi bi-people text-info" style="font-size:2rem;opacity:0.3"></i></div></div></div></div>
            <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><div class="d-flex justify-content-between"><div><h6 class="text-muted small">Registrations</h6><h3 class="fw-bold text-warning" th:text="${stats.totalRegistrations}">0</h3></div><i class="bi bi-clipboard-check text-warning" style="font-size:2rem;opacity:0.3"></i></div></div></div></div>
        </div>
        
        <div class="row g-3 mb-4">
            <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><h6 class="text-muted small">Organizers</h6><h4 th:text="${stats.totalOrganizers}">0</h4></div></div></div>
            <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><h6 class="text-muted small">Participants</h6><h4 th:text="${stats.totalParticipants}">0</h4></div></div></div>
            <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><h6 class="text-muted small">Avg Score</h6><h4 th:text="${#numbers.formatDecimal(stats.avgSustainabilityScore, 1, 1)}">0</h4></div></div></div>
            <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><h6 class="text-muted small">Total Revenue</h6><h4 th:text="'₹' + ${#numbers.formatDecimal(stats.totalRevenue, 0, 0)}">₹0</h4></div></div></div>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white"><h6 class="mb-0 fw-bold">Recent Events</h6></div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <tbody>
                                <tr th:each="event : ${recentEvents}">
                                    <td><a th:href="@{'/events/' + ${event.id}}" th:text="${event.title}">Event</a></td>
                                    <td><span class="badge" th:classappend="${event.published ? 'bg-success' : 'bg-secondary'}" th:text="${event.published ? 'Published' : 'Draft'}">Status</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white"><h6 class="mb-0 fw-bold">Recent Users</h6></div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <tbody>
                                <tr th:each="user : ${recentUsers}">
                                    <td th:text="${user.fullName}">Name</td>
                                    <td><span class="badge bg-info" th:text="${user.role.replace('ROLE_', '')}">Role</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
