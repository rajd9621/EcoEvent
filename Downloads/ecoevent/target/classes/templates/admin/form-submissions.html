<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Submissions')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="d-flex">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
<h2 class="fw-bold text-primary mb-2"><i class="bi bi-inbox me-2"></i>Submissions: <span th:text="${form.name}">Form</span></h2>
<p><a th:href="@{/admin/forms}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Forms</a></p>
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>Submitted At</th><th>IP</th><th>Data</th></tr></thead>
            <tbody>
                <tr th:each="sub : ${submissions}">
                    <td th:text="${#temporals.format(sub.submittedAt, 'dd MMM yyyy HH:mm')}">Date</td>
                    <td th:text="${sub.submitterIp}">IP</td>
                    <td><code th:text="${#strings.abbreviate(sub.submittedData, 100)}">Data</code></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
