<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gallery')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-5">
    <h2 class="fw-bold text-primary mb-4">Event Gallery</h2>
    <div class="row g-3">
        <div class="col-md-4 col-sm-6" th:each="event : ${events}">
            <div class="gallery-item">
                <img th:src="${event.imageUrl != null ? event.imageUrl : 'https://via.placeholder.com/400/2E7D32/fff?text=EcoEvent'}" 
                     class="img-fluid rounded shadow-sm" alt="Event" style="width:100%;height:220px;object-fit:cover"/>
                <div class="gallery-overlay">
                    <h6 th:text="${event.title}">Title</h6>
                    <p class="small mb-0" th:text="${event.location}">Location</p>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
