<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: header}"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-5">
                    <h2 class="text-center fw-bold text-primary mb-1">Welcome Back</h2>
                    <p class="text-center text-muted mb-4">Sign in to your EcoEvent account</p>
                    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}">Error</div>
                    <div th:if="${message != null}" class="alert alert-success" th:text="${message}">Message</div>
                    <div th:if="${param.registered != null}" class="alert alert-success">Registration successful! Please login.</div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="username" class="form-control" placeholder="Enter your email" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter your password" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In</button>
                    </form>
                    <div class="text-center mt-3">
                        <p class="text-muted small mb-0">Don't have an account? <a th:href="@{/register}" class="text-primary">Register here</a></p>
                    </div>
                    <hr class="my-4"/>
                    <div class="text-center text-muted small">
                        <p class="fw-bold mb-1">Demo Accounts:</p>
                        <p class="mb-0">Admin: admin@ecoevent.com / demo123</p>
                        <p class="mb-0">Organizer: organizer@ecoevent.com / demo123</p>
                        <p class="mb-0">Participant: participant@ecoevent.com / demo123</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
